tool.notree.name=No-Tree Zone (Deforest)
tool.notree.desc=Marks tiles as permanent deforestation zone. Trees and bushes will NEVER regrow here!
tool.forest.name=Forest Zone (Cultivate)
tool.forest.desc=Forces trees to cultivate and regrow indefinitely, even on open plains and steppe.
tool.reset.name=Remove Zone (Reset)
tool.reset.desc=Removes zone designations and restores natural vanilla terrain growth.
tool.clear_area.name=Clear Area (Gardener Brush)
tool.clear_area.desc=Instantly clears all trees, flowers, bushes and wild herbs in the selected area.

